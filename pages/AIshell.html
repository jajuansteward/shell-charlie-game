<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Shell Game</title>
    <style>
        :root {
            --bg: #121214;
            --surface: #1a1a1e;
            --gold: #f1c40f;
            --red: #e74c3c;
            --green: #2ecc71;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-card {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 550px;
        }

        h1 {
            margin-top: 0;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #aaa;
        }

        .stats span {
            color: #fff;
        }

        .cup-container {
            height: 180px;
            background: #0f3d1a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 25px;
            border-bottom: 6px solid #0a2911;
            position: relative;
        }

        .cup-box {
            position: absolute;
            bottom: 15px;
            width: 80px;
            height: 120px;
            cursor: pointer;
            transition: left 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .cup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border-radius: 40px 40px 10px 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* The Ruby Ball element setup */
        .ball {
            position: absolute;
            bottom: 5px;
            left: 28px;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ff4757, #ff6b81, #b33939);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            z-index: 1;
            
            /* Clean visual state baseline */
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s ease, transform 0.4s ease;
        }

        /* FIXED: When lifted class is appended, lift cup AND make ball visible cleanly */
        .cup-box.lifted .cup {
            transform: translateY(-50px) rotate(-5deg);
        }

        .cup-box.lifted .ball {
            opacity: 1;
            transform: scale(1);
        }

        .status-msg {
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 30px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #f39c12;
        }

        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .lock-clicks {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Shell Casino</h1>
        
        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Streak: <span id="streak">0</span></div>
        </div>

        <div class="cup-container lock-clicks" id="cupBoard">
            <!-- Box 0 remains the permanent home of the ruby ball -->
            <div class="cup-box" id="box-0" onclick="makeGuess(0)">
                <div class="cup"></div>
                <div class="ball"></div>
            </div>
            <div class="cup-box" id="box-1" onclick="makeGuess(1)">
                <div class="cup"></div>
                <!-- Box 1 and 2 are empty shells -->
            </div>
            <div class="cup-box" id="box-2" onclick="makeGuess(2)">
                <div class="cup"></div>
            </div>
        </div>

        <div class="status-msg" id="statusLabel">Press Shuffle to begin!</div>
        <button class="btn" id="playBtn" onclick="playShuffle()">Shuffle Cups</button>
    </div>

<script>
    const positions = ["10%", "42%", "74%"];
    
    // Starting layout state map
    let currentMapping = [0, 1, 2];
    
    let isPlaying = false;
    let currentScore = 0;
    let currentStreak = 0;

    function renderPositions() {
        currentMapping.forEach((cupId, positionIndex) => {
            document.getElementById(`box-${cupId}`).style.left = positions[positionIndex];
        });
    }

    // Paint layout on boot setup
    renderPositions();

    async function playShuffle() {
        if (isPlaying) return;
        isPlaying = true;

        document.getElementById('playBtn').disabled = true;
        document.getElementById('cupBoard').classList.add('lock-clicks');
        document.getElementById('statusLabel').textContent = "Locating the ball...";

        // Reset visual lifts
        for (let i = 0; i < 3; i++) {
            document.getElementById(`box-${i}`).classList.remove('lifted');
        }

        // 1. Reveal where the ball starts (Always under Box 0)
        await new Promise(r => setTimeout(r, 400));
        document.getElementById('box-0').classList.add('lifted');
        document.getElementById('statusLabel').textContent = "Watch Box 1 closely!";

        // 2. Put the cup back down
        await new Promise(r => setTimeout(r, 1200));
        document.getElementById('box-0').classList.remove('lifted');
        document.getElementById('statusLabel').textContent = "Shuffling...";
        await new Promise(r => setTimeout(r, 500));

        // 3. Move the positional track mappings
        const shuffleCount = 6;
        for (let i = 0; i < shuffleCount; i++) {
            let idxA = Math.floor(Math.random() * 3);
            let idxB = (idxA + Math.floor(Math.random() * 2) + 1) % 3;

            let temp = currentMapping[idxA];
            currentMapping[idxA] = currentMapping[idxB];
            currentMapping[idxB] = temp;

            renderPositions();
            await new Promise(r => setTimeout(r, 350));
        }

        // 4. Ready for selection
        document.getElementById('statusLabel').textContent = "Where is the red ruby?";
        document.getElementById('cupBoard').classList.remove('lock-clicks');
    }

    function makeGuess(clickedCupId) {
        document.getElementById('cupBoard').classList.add('lock-clicks');
        
        // Lift the clicked cup box element
        document.getElementById(`box-${clickedCupId}`).classList.add('lifted');
        const label = document.getElementById('statusLabel');

        // Check if the clicked element is Box 0 (the ball carrier)
        if (clickedCupId === 0) {
            currentScore += 100;
            currentStreak++;
            label.innerHTML = "<span style='color: var(--green)'>🎉 Found it! Excellent work!</span>";
        } else {
            currentStreak = 0;
            label.innerHTML = "<span style='color: var(--red)'>❌ Empty! Better luck next time.</span>";
            
            // Auto reveal where Box 0 slid off to
            setTimeout(() => {
                document.getElementById('box-0').classList.add('lifted');
            }, 350);
        }

        document.getElementById('score').textContent = currentScore;
        document.getElementById('streak').textContent = currentStreak;

        isPlaying = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('playBtn').textContent = "Next Round";
    }
</script>
</body>
</html>
